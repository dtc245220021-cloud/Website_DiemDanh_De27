services:
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus','--storage.tsdb.retention.time=7d']
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus_data:/prometheus]
    ports: ['127.0.0.1:${PROM_PORT:-9090}:9090']
    networks: [monitoring]
    healthcheck:
      test: ['CMD','wget','-qO-','http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5
  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    user: '472:472'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes: [grafana_data:/var/lib/grafana, ./monitoring/grafana:/etc/grafana/provisioning:ro]
    ports: ['127.0.0.1:${GRAFANA_PORT:-3001}:3000']
    networks: [monitoring]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ['CMD','wget','-qO-','http://127.0.0.1:3000/api/health']
      interval: 20s
      timeout: 5s
      retries: 5
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ['--nginx.scrape-uri=http://nginx:8082/stub_status']
    networks: [web, monitoring]
    depends_on:
      nginx: {condition: service_healthy}
  mysql-exporter:
    image: prom/mysqld-exporter:v0.18.0
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ['--config.my-cnf=/run/secrets/exporter.cnf']
    volumes: [./secrets/exporter.cnf:/run/secrets/exporter.cnf:ro]
    networks: [database, monitoring]
    depends_on:
      mysql: {condition: service_healthy}
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.3
    restart: unless-stopped
    privileged: true
    command: ['--docker_only=true','--housekeeping_interval=15s','--store_container_labels=true']
    volumes: ['/:/rootfs:ro','/var/run:/var/run:ro','/sys:/sys:ro','/var/lib/docker:/var/lib/docker:ro','/dev/disk:/dev/disk:ro']
    devices: ['/dev/kmsg:/dev/kmsg']
    networks: [monitoring]
networks:
  monitoring:
volumes:
  prometheus_data:
  grafana_data:

