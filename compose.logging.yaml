services:
  loki:
    image: grafana/loki:3.5.7
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes: [./logging/loki.yaml:/etc/loki/loki.yaml:ro, loki_data:/loki]
    ports: ['127.0.0.1:${LOKI_PORT:-3100}:3100']
    networks: [monitoring]
    healthcheck:
      test: ['CMD','wget','-qO-','http://127.0.0.1:3100/ready']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
  promtail:
    image: grafana/promtail:3.5.7
    user: '0:0'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    command: ['-config.file=/etc/promtail/promtail.yaml']
    volumes: [./logging/promtail.yaml:/etc/promtail/promtail.yaml:ro, app_logs:/logs/app:ro, nginx_logs:/logs/nginx:ro, promtail_positions:/positions]
    networks: [monitoring]
    depends_on:
      loki: {condition: service_healthy}
volumes:
  loki_data:
  promtail_positions:
